# Paths
data_dir: "data/"
output_dir: "outputs/"
reports_dir: "reports/"
checkpoint_dir: "checkpoints/"

# Data split
split_ratios:
  train: 0.8
  val: 0.1
  test: 0.1
seed: 42

# Image preprocessing
image_size: 128  # 128x128
num_channels: 3  # grayscale replicated to 3-channel for transfer learning
normalize_mode: "imagenet"  # or "rescale" for [0,1]

# Training defaults
mixed_precision: true
layout_optimizer: false  # TF grappler bug workaround for Kaggle P100
label_smoothing: 0.1
batch_size: 64

# Augmentation
augmentation:
  rotation_range: 10
  width_shift: 0.1
  height_shift: 0.1
  zoom_range: 0.1
  brightness_range: [0.9, 1.1]
  horizontal_flip: false  # NEVER flip Telugu characters
  mixup_alpha: 0.0  # disabled by default for fine-grained problem
  elastic_deformation: true
